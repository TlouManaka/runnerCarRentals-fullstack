<nav class="navbar navbar-expand-md">
  <div class="container-fluid m-0 px-4 py-3 justify-content-between">
    <a class="navbar-brand d-flex align-items-center justify-content-center gap-2" routerLink="/home">
      <mat-icon class="imgLogo" svgIcon="logo"></mat-icon>
      <span class="logo">Runners Car Rental</span>
    </a>

    <button
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#navbarNav"
      class="navbar-toggler"
      aria-controls="navbarNav"
      aria-expanded="false"
      aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
      <ul class="navbar-nav align-items-md-center gap-md-3 me-md-3">
        <li class="nav-item">
          <a class="nav-link" routerLink="/home" routerLinkActive="active-link">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/cars" routerLinkActive="active-link">Vehicles</a>
        </li>
        @if (auth.isLoggedIn()) {
          <li class="nav-item">
            <a class="nav-link" routerLink="/bookings" routerLinkActive="active-link">My bookings</a>
          </li>
        }
        @if (auth.isAdmin()) {
          <li class="nav-item">
            <a class="nav-link" routerLink="/admin" routerLinkActive="active-link">Admin</a>
          </li>
        }
      </ul>

      <div class="nav-auth d-flex align-items-center gap-2 mt-3 mt-md-0">
        @if (auth.isLoggedIn()) {
          <span class="nav-user">{{ auth.user()?.fullName }}</span>
          <button class="btn btn-outline-secondary btn-sm" type="button" (click)="logout()">Sign out</button>
        } @else {
          <a class="btn btn-outline-secondary btn-sm" routerLink="/login">Sign in</a>
          <a class="btn btn-primary btn-sm" routerLink="/register">Sign up</a>
        }
      </div>
    </div>
  </div>
</nav>
